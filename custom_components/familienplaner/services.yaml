termin_anlegen:
  fields:
    person:
      required: true
      example: anna
      selector:
        text:
    titel:
      required: true
      example: Fußball
      selector:
        text:
    start:
      required: true
      selector:
        datetime:
    dauer:
      default: 60
      selector:
        number:
          min: 5
          max: 1440
          step: 5
          unit_of_measurement: min
    ganztag:
      default: false
      selector:
        boolean:
    ort:
      selector:
        text:
    fahrer:
      example: carla
      selector:
        text:
    benachrichtigen:
      default: true
      selector:
        boolean:
    rrule:
      example: "FREQ=WEEKLY"
      selector:
        text:
gericht_planen:
  fields:
    tag:
      required: true
      selector:
        date:
    gericht:
      required: true
      example: Lasagne
      selector:
        text:
    zutaten:
      example: "Nudelplatten, Hackfleisch, Tomaten"
      selector:
        text:
          multiline: true
benachrichtigen:
  fields:
    person:
      required: true
      example: familie
      selector:
        text:
    titel:
      required: true
      selector:
        text:
    nachricht:
      required: true
      selector:
        text:
          multiline: true
morgen_ansage:

termin_aus_satz:
  fields:
    text:
      required: true
      example: "Ben hat Dienstag um 16 Uhr Fußball, Anna fährt"
      selector:
        text:

wochenrueckblick:

freie_zeit:
  fields:
    tage:
      default: 7
      selector:
        number: {min: 1, max: 31, mode: box}
    dauer:
      default: 60
      selector:
        number: {min: 15, max: 600, step: 15, unit_of_measurement: min, mode: box}
    personen:
      example: "anna, ben"
      selector:
        text:
    von:
      default: "08:00:00"
      selector:
        time:
    bis:
      default: "20:00:00"
      selector:
        time:

punkte_buchen:
  fields:
    person:
      required: true
      example: anna
      selector:
        text:
    punkte:
      required: true
      example: 10
      selector:
        number:
          min: -1000
          max: 1000
          mode: box
    aufgaben:
      default: 0
      selector:
        number:
          min: -100
          max: 100
          mode: box

belohnung_einloesen:
  fields:
    belohnung:
      required: true
      example: Eis essen
      selector:
        text:
    kosten:
      required: true
      example: 50
      selector:
        number:
          min: 1
          max: 100000
          mode: box
    person:
      example: ben
      selector:
        text:

fahrzeug_waehlen:
  fields:
    person:
      required: true
      example: ben
      selector:
        text:
    fahrzeug:
      example: Rennwagen
      selector:
        select:
          options:
            - Auto
            - Rennwagen
            - Motorrad
            - Pferd
            - Einhorn
            - Fahrrad
            - Traktor
            - Rakete
            - Monstertruck
            - Hai-Truck
            - Dino-Truck
            - Blitz-Truck
            - Polizei-Truck
            - Feuerwehr-Truck
            - Bagger-Truck
            - Einhorn-Truck
            - Renn-Truck
    farbe:
      example: Lila
      selector:
        text:
    bild:
      example: /local/familienplaner/truck.png
      selector:
        text:

rennen_neu_starten:

dienste_verteilen:

belohnungen_festlegen:
  fields:
    belohnungen:
      required: true
      example: '[{"name": "Eis essen", "kosten": 50, "icon": "mdi:ice-cream"}]'
      selector:
        object:

dienste_festlegen:
  fields:
    dienste:
      required: true
      example: '[{"titel": "🍽️ Spülmaschine ausräumen", "punkte": 15, "tage": [0,1,2,3,4,5,6]}]'
      selector:
        object:

schatzkarte_festlegen:
  fields:
    stationen:
      required: true
      example: '[{"emoji": "🐚", "name": "Shell Beach", "belohnung": "Ice cream together", "punkte": 150}]'
      selector:
        object:

neue_insel:

aufgabe_nehmen:
  fields:
    aufgabe:
      required: true
      example: "staubsaugen"
      selector:
        text:
    person:
      example: "ben"
      selector:
        text:
    punkte:
      selector:
        number:
          min: 0
          max: 1000

katalog_festlegen:
  fields:
    aufgaben:
      required: true
      example: '[{"titel": "🧹 Staubsaugen", "punkte": 25, "bereich": "putzen"}]'
      selector:
        object:
